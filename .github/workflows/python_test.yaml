name: Bakehouse Python Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: notebooks/FINAL-PROJECT-bakehouse-pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pyspark==4.2.0

      - name: Run unit tests
        env:
          PYTHONPATH: .
          SPARK_LOCAL_IP: 127.0.0.1
        run: python -m pytest tests/ -v